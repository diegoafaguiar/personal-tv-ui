name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: android-tv/tests/fake-adb/adb
        env:
          SHELLCHECK_OPTS: -x

      - name: bash -n
        run: for f in android-tv/scripts/*.sh android-tv/lib/common.sh android-tv/tests/run.sh android-tv/tests/fake-adb/adb roku/scripts/*.sh roku/lib/*.sh roku/tests/run.sh; do bash -n "$f"; done

      - name: Testes Android TV (adb falso)
        run: android-tv/tests/run.sh

      - name: Testes Roku (ECP falso)
        run: roku/tests/run.sh
