name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: tests/fake-adb/adb
        env:
          SHELLCHECK_OPTS: -x

      - name: bash -n
        run: for f in scripts/*.sh lib/common.sh tests/run.sh tests/fake-adb/adb; do bash -n "$f"; done

      - name: Testes com adb falso
        run: tests/run.sh
