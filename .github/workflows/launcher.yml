name: Launcher APK

on:
  push:
    paths: ["android-tv/launcher/**", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["android-tv/launcher/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv/launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug e release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Lint (Android Lint, não falha o build)
        run: ./gradlew --no-daemon lintDebug || true

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: |
            android-tv/launcher/app/build/outputs/apk/debug/app-debug.apk
            android-tv/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
